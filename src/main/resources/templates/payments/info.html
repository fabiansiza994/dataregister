<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planes y Suscripción</title>

  <!-- Bootstrap + Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
  <link rel="icon" href="https://dataregisterbucket.s3.us-east-2.amazonaws.com/icons/icon.png" type="image/png">
  <style>
    body {
      background: linear-gradient(135deg, #f0f4ff, #dbeafe);
      font-family: 'Segoe UI', sans-serif;
    }

    .pricing-card {
      background: white;
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      max-width: 700px;
      margin: 80px auto;
      animation: fadeIn 0.5s ease;
    }

    .price {
      font-size: 2.5rem;
      font-weight: bold;
      color: #0d6efd;
    }

    .feature-list {
      list-style: none;
      padding: 0;
    }

    .feature-list li {
      margin-bottom: 0.8rem;
    }

    .feature-list i {
      color: #198754;
      margin-right: 8px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<div class="pricing-card text-center">
  <h2 class="mb-3">Suscripción Mensual</h2>
  <p class="text-muted mb-4">Disfruta de todas las funcionalidades por solo:</p>
  <div class="price">$10 USD</div>
  <p class="text-muted mb-4">Pago seguro a través de PayPal</p>

  <ul class="feature-list text-start mx-auto" style="max-width: 400px;">
    <li><i class="bi bi-check-circle-fill"></i> Registro y gestión de trabajos</li>
    <li><i class="bi bi-check-circle-fill"></i> Control de clientes por grupo</li>
    <li><i class="bi bi-check-circle-fill"></i> Reportes y estadísticas visuales</li>
    <li><i class="bi bi-check-circle-fill"></i> Acceso multiusuario por empresa</li>
  </ul>

  <!--<form action="/payment/create" method="post" class="mt-4">
    <button type="submit" class="btn btn-primary btn-lg">
      <i class="bi bi-credit-card me-2"></i> Suscribirme Ahora
    </button>
  </form>-->

  <a href="/" class="btn btn-link mt-3 text-secondary"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
</div>

</body>
</html>
