<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <base href="https://dataregisterapp.com/" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activar Suscripción</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Íconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-custom {
            max-width: 600px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        .icon-large {
            font-size: 3rem;
            color: #ffc107;
        }
    </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Contenido principal -->
<main class="d-flex justify-content-center mt-4">
    <div class="container-custom text-center">
        <i class="bi bi-exclamation-circle icon-large"></i>
        <h2 class="mt-3">Tu suscripción está pausada</h2>
        <p class="lead">Para seguir administrando tu negocio, activa tu cuenta.</p>
        <p>Haz clic en el botón de abajo para renovar tu suscripción.</p>
        <form action="/payment/create" method="post" class="mt-4">
            <button type="submit" class="btn btn-primary">Activar Cuenta</button>
        </form>
    </div>
</main>
<script src="/js/resolver-rutas.js"></script>
</body>
</html>
