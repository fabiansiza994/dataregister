<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Clientes</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Íconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container-custom {
            max-width: 800px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .card + .card {
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<!-- Menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Contenido -->
<main class="d-flex justify-content-center mt-4 px-2">
    <div class="container-custom w-100">
        <h3 class="text-center mb-4">Lista de Clientes</h3>

        <!-- Mensaje éxito al registrar -->
        <div th:if="${param.success}" class="alert alert-success text-center">
            ¡Cliente registrado con éxito!
        </div>

        <!-- Botón agregar -->
        <div class="mb-3 text-center">
            <a href="/clientes/nuevo" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Agregar Cliente
            </a>
        </div>

        <!-- Buscar -->
        <form th:action="@{/clientes/buscar}" method="get"
              class="mb-3 d-flex flex-column flex-sm-row justify-content-center gap-2">
            <input type="text" name="nombre" th:value="${nombreBuscado}" class="form-control"
                   placeholder="Buscar por nombre o apellido">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-search"></i> Buscar
            </button>
        </form>

        <!-- No encontrados -->
        <div th:if="${clientes.isEmpty() and nombreBuscado != null}" class="alert alert-warning text-center">
            <i class="bi bi-exclamation-triangle"></i> No se encontraron clientes con el nombre
            "<span th:text="${nombreBuscado}"></span>".
        </div>

        <!-- Tabla (pantallas medianas o grandes) -->
        <div class="table-responsive d-none d-md-block" th:if="${not clientes.isEmpty()}">
            <table class="table table-bordered table-hover align-middle text-center">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Activar/Inactivar</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id}"></td>
                    <td th:text="${cliente.nombre}"></td>
                    <td th:text="${cliente.apellido}"></td>
                    <td th:text="${cliente.direccion}"></td>
                    <td th:text="${cliente.telefono}"></td>
                    <td>
                        <span th:class="${cliente.estado == 'ACTIVO'} ? 'badge bg-success' : 'badge bg-danger'"
                              th:text="${cliente.estado}"></span>
                    </td>
                    <td>
                        <form th:action="@{clientes/cambiar-estado/{id}(id=${cliente.id})}" method="post">
                            <button type="submit" class="btn btn-warning btn-sm">
                                <i class="bi" th:classappend="${cliente.estado == 'ACTIVO'} ? ' bi-toggle-on' : ' bi-toggle-off'"></i>
                                <span th:text="${cliente.estado == 'ACTIVO' ? 'Desactivar' : 'Activar'}"></span>
                            </button>
                        </form>
                    </td>
                    <td>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-secondary btn-sm">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <form th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}" method="post"
                                  onsubmit="return confirmarEliminarCliente(this)" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Cards (pantallas pequeñas) -->
        <div class="d-block d-md-none" th:if="${not clientes.isEmpty()}">
            <div th:each="cliente : ${clientes}" class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-1">
                            <span th:text="${cliente.nombre} + ' ' + ${cliente.apellido}"></span>
                        </h5>
                        <span th:class="${cliente.estado == 'ACTIVO'} ? 'badge bg-success' : 'badge bg-danger'"
                              th:text="${cliente.estado}"></span>
                    </div>

                    <p class="mb-1"><strong>Dirección:</strong> <span th:text="${cliente.direccion}"></span></p>
                    <p class="mb-2"><strong>Teléfono:</strong> <span th:text="${cliente.telefono}"></span></p>

                    <div class="d-grid gap-2">
                        <form th:action="@{clientes/cambiar-estado/{id}(id=${cliente.id})}" method="post">
                            <button type="submit" class="btn btn-warning btn-sm w-100">
                                <i class="bi" th:classappend="${cliente.estado == 'ACTIVO'} ? ' bi-toggle-on' : ' bi-toggle-off'"></i>
                                <span th:text="${cliente.estado == 'ACTIVO' ? 'Desactivar' : 'Activar'}"></span>
                            </button>
                        </form>

                        <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-secondary btn-sm w-100">
                            <i class="bi bi-pencil-square"></i> Editar
                        </a>
                        <form th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}" method="post"
                              onsubmit="return confirmarEliminarCliente(this)" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm w-100">
                                <i class="bi bi-trash"></i> Eliminar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- SweetAlert: Confirmar eliminación -->
<script>
    function confirmarEliminarCliente(form) {
        event.preventDefault();

        Swal.fire({
            title: "¿Eliminar cliente?",
            text: "Esta acción no se puede deshacer.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#d33",
            cancelButtonColor: "#3085d6",
            confirmButtonText: "Sí, eliminar",
            cancelButtonText: "Cancelar"
        }).then((result) => {
            if (result.isConfirmed) {
                form.submit();
            }
        });

        return false;
    }
</script>

<!-- SweetAlert: Mostrar mensaje de éxito o error -->
<script th:inline="javascript" th:if="${success}">
    Swal.fire({
        icon: 'success',
        title: 'Éxito',
        text: [[${success}]],
        confirmButtonColor: '#3085d6'
    });
</script>

<script th:inline="javascript" th:if="${error}">
    Swal.fire({
        icon: 'error',
        title: 'Error',
        text: [[${error}]],
        confirmButtonColor: '#d33'
    });
</script>

</body>
</html>
