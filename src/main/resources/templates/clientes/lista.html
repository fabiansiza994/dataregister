<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Clientes</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Íconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-custom {
            max-width: 950px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<!-- Menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="d-flex justify-content-center mt-4 px-2">
    <div class="container-custom w-100">
        <h3 class="text-center mb-4">Lista de Clientes</h3>

        <div th:if="${param.success}" class="alert alert-success text-center">
            ¡Cliente registrado con éxito!
        </div>

        <div class="mb-3 text-center">
            <a href="/clientes/nuevo" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Agregar Cliente
            </a>
        </div>

        <div class="mb-4 d-flex flex-column flex-sm-row justify-content-center gap-2">
            <input type="text" id="busquedaCliente" class="form-control" placeholder="Buscar por nombre o apellido">
            <button onclick="cargarClientes(0)" class="btn btn-primary">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>

        <div id="loaderClientes" class="text-center my-4" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2 text-primary">Cargando clientes...</p>
        </div>

        <div class="table-responsive" id="tablaClientesContainer">
            <!-- Se llena por JavaScript -->
        </div>

        <div class="d-flex justify-content-between mt-3">
            <button id="btnAnterior" class="btn btn-outline-secondary" onclick="cargarClientes(paginaActual - 1)" disabled>Anterior</button>
            <button id="btnSiguiente" class="btn btn-outline-secondary" onclick="cargarClientes(paginaActual + 1)" disabled>Siguiente</button>
        </div>
    </div>
</main>

<script>
    let paginaActual = 0;

    function cargarClientes(pagina) {
        if (pagina < 0) return;

        const nombre = document.getElementById("busquedaCliente").value;
        const url = nombre
            ? `/clientes/buscarAjax?nombre=${encodeURIComponent(nombre)}`
            : `/clientes/listarAjaxTodos?page=${pagina}`;

        document.getElementById("loaderClientes").style.display = "block";
        document.getElementById("tablaClientesContainer").style.display = "none";

        fetch(url)
            .then(res => res.json())
            .then(data => {
                const clientes = data.content || data;

                let html = `
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th class="d-none d-sm-table-cell">Dirección</th>
                            <th class="d-none d-sm-table-cell">Teléfono</th>
                            <th>Estado</th>
                            <th>Activar/Inactivar</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>`;

                if (clientes.length === 0) {
                    html += `<tr><td colspan="8" class="text-center text-warning">No se encontraron clientes.</td></tr>`;
                } else {
                    clientes.forEach(c => {
                        const estado = c.estado || "ACTIVO";
                        const isActivo = estado === "ACTIVO";
                        html += `
                        <tr class="text-center">
                            <td>${c.id}</td>
                            <td>${c.nombre}</td>
                            <td>${c.apellido}</td>
                            <td class="d-none d-sm-table-cell">${c.direccion ?? '-'}</td>
                            <td class="d-none d-sm-table-cell">${c.telefono ?? '-'}</td>
                            <td>
                                <span class="badge ${isActivo ? 'bg-success' : 'bg-danger'}">${estado}</span>
                            </td>
                            <td>
                                <form method="post" action="/clientes/cambiar-estado/${c.id}">
                                    <button type="submit" class="btn btn-warning btn-sm">
                                        <i class="bi ${isActivo ? 'bi-toggle-on' : 'bi-toggle-off'}"></i>
                                        ${isActivo ? 'Desactivar' : 'Activar'}
                                    </button>
                                </form>
                            </td>
                            <td>
                                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                                    <a href="/clientes/editar/${c.id}" class="btn btn-secondary btn-sm"><i class="bi bi-pencil-square"></i></a>
                                    <form action="/clientes/eliminar/${c.id}" method="post" onsubmit="return confirmarEliminar(this)">
                                        <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>`;
                    });
                }

                html += `</tbody></table>`;
                document.getElementById("tablaClientesContainer").innerHTML = html;

                if (data.pageable) {
                    paginaActual = data.number;
                    document.getElementById("btnAnterior").disabled = data.first;
                    document.getElementById("btnSiguiente").disabled = data.last;
                }

                document.getElementById("loaderClientes").style.display = "none";
                document.getElementById("tablaClientesContainer").style.display = "block";
            })
            .catch(err => {
                console.error("Error al cargar clientes:", err);
                document.getElementById("tablaClientesContainer").innerHTML =
                    `<div class="alert alert-danger text-center">Error al cargar los clientes.</div>`;
                document.getElementById("loaderClientes").style.display = "none";
                document.getElementById("tablaClientesContainer").style.display = "block";
            });
    }

    function confirmarEliminar(form) {
        event.preventDefault();
        Swal.fire({
            title: "¿Eliminar cliente?",
            text: "Esta acción no se puede deshacer.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#d33",
            cancelButtonColor: "#3085d6",
            confirmButtonText: "Sí, eliminar",
            cancelButtonText: "Cancelar"
        }).then((result) => {
            if (result.isConfirmed) {
                form.submit();
            }
        });
        return false;
    }

    window.onload = () => cargarClientes(0);
</script>

</body>
</html>
