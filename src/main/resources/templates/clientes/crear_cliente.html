<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Cliente</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Íconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-custom {
            max-width: 600px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Contenido principal centrado -->
<main class="d-flex justify-content-center mt-4">
    <div class="container-custom w-100">
        <h3 class="text-center mb-4">Crear Cliente</h3>

        <!-- Mensaje de éxito -->
        <div th:if="${param.success}" class="alert alert-success text-center">
            ¡Cliente registrado con éxito!
        </div>

        <form th:action="@{/clientes/guardar}" method="post">

            <!-- Nombre -->
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="nombre" class="form-control" placeholder="Ingrese el nombre" required>
                </div>
            </div>

            <!-- Apellido -->
            <div class="mb-3">
                <label class="form-label">Apellido</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="apellido" class="form-control" placeholder="Ingrese el apellido" required>
                </div>
            </div>

            <!-- Correo Electrónico -->
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="Ingrese el correo" required>
                </div>
            </div>

            <!-- Teléfono -->
            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                    <input type="text" name="telefono" class="form-control" placeholder="Ingrese el teléfono" required>
                </div>
            </div>

            <!-- Dirección -->
            <div class="mb-3">
                <label class="form-label">Dirección</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-house"></i></span>
                    <input type="text" name="direccion" class="form-control" placeholder="Ingrese la dirección" required>
                </div>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="btn btn-primary w-100">Guardar Cliente</button>
        </form>
    </div>
</main>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Mostrar alerta si viene con error -->
<script th:if="${param.error}" th:inline="javascript">
    Swal.fire({
        icon: 'info',
        title: 'Información necesaria',
        text: [[${param.error}]],
        confirmButtonColor: '#0d6efd'
    });
</script>
</body>
</html>
