<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <base href="https://dataregisterapp.com/" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Cliente</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .container-custom {
      max-width: 600px;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Contenido principal centrado -->
<main class="d-flex justify-content-center mt-4">
  <div class="container-custom w-100">
    <h3 class="text-center mb-4">Editar Cliente</h3>

    <!-- Mensaje de éxito -->
    <div th:if="${param.success}" class="alert alert-success text-center">
      ¡Cliente actualizado con éxito!
    </div>

    <form th:action="@{/clientes/actualizar}" method="post">

      <!-- Campo oculto para el ID -->
      <input type="hidden" th:field="${cliente.id}" />

      <!-- Nombre -->
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" th:field="${cliente.nombre}" class="form-control" required>
        </div>
      </div>

      <!-- Apellido -->
      <div class="mb-3">
        <label class="form-label">Apellido</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" th:field="${cliente.apellido}" class="form-control" required>
        </div>
      </div>

      <!-- Correo Electrónico -->
      <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" th:field="${cliente.email}" class="form-control" required>
        </div>
      </div>

      <!-- Teléfono -->
      <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-telephone"></i></span>
          <input type="text" th:field="${cliente.telefono}" class="form-control" required>
        </div>
      </div>

      <!-- Dirección -->
      <div class="mb-3">
        <label class="form-label">Dirección</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-house"></i></span>
          <input type="text" th:field="${cliente.direccion}" class="form-control" required>
        </div>
      </div>

      <!-- Campo oculto para el usuario asociado -->
      <input type="hidden" name="usuario.id" th:value="${cliente.usuario.id}" />

      <!-- Botones -->
      <div class="d-flex justify-content-between">
        <a href="/clientes" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> Volver
        </a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save"></i> Guardar Cambios
        </button>
      </div>

    </form>
  </div>
</main>
<script src="/js/resolver-rutas.js"></script>
</body>
</html>
