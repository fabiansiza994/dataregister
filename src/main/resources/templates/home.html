<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="icon" href="https://dataregisterbucket.s3.us-east-2.amazonaws.com/icons/icon.png" type="image/png">
    <style>
        body {
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            font-family: 'Segoe UI', sans-serif;
        }

        .container-custom {
            max-width: 1000px;
            background: white;
            padding: 3rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
            margin-top: 60px;
        }

        .icon-large {
            font-size: 3.5rem;
            color: #0d6efd;
        }

        .card:hover {
            transform: translateY(-5px);
            transition: 0.3s ease-in-out;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .card {
            border: 1px dotted;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .lead {
            font-size: 1.1rem;
            color: #6c757d;
        }

        @media (max-width: 767px) {
            .icon-large {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

<!-- Menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Alerta de pago -->
<div th:if="${alertaPago}" class="alert alert-warning text-center mb-0" role="alert">
    <strong th:text="${alertaPago}"></strong>
    <form action="/payment/create" method="post" class="d-inline">
        <button type="submit" class="btn btn-sm btn-primary ms-2">Realizar pago</button>
    </form>
</div>

<!-- Contenido principal -->
<main class="d-flex justify-content-center mt-4 px-3">
    <div class="container-custom w-100 text-center">
        <h2 class="mb-3 fw-bold">Bienvenido a <span class="text-primary">Data Register</span></h2>
        <p class="lead">Administra fácilmente tus clientes, trabajos y pagos desde un solo lugar.</p>

        <!-- Accesos rápidos -->
        <div class="row mt-5 g-4">
            <div class="col-12 col-md-4">
                <a th:href="@{/clientes}" class="text-decoration-none text-dark">
                    <div class="card py-4 px-3 h-100">
                        <i class="bi bi-people icon-large mb-3"></i>
                        <h5 class="fw-semibold">Clientes</h5>
                        <p class="mb-0">Ver y gestionar tus clientes</p>
                    </div>
                </a>
            </div>

            <div class="col-12 col-md-4">
                <a th:href="@{/trabajos/listar}" class="text-decoration-none text-dark">
                    <div class="card py-4 px-3 h-100">
                        <i class="bi bi-clipboard-check icon-large mb-3"></i>
                        <h5 class="fw-semibold">Trabajos</h5>
                        <p class="mb-0">Consultar trabajos realizados</p>
                    </div>
                </a>
            </div>

            <div class="col-12 col-md-4">
                <a th:href="@{/trabajos/registro}" class="text-decoration-none text-dark">
                    <div class="card py-4 px-3 h-100">
                        <i class="bi bi-plus-square icon-large mb-3"></i>
                        <h5 class="fw-semibold">Nuevo Trabajo</h5>
                        <p class="mb-0">Registrar un nuevo trabajo</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
