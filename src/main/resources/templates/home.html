<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Íconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        /* Estilos personalizados */
        body {
            background-color: #f8f9fa;
        }
        .container-custom {
            max-width: 900px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        .icon-large {
            font-size: 3rem;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Alerta de pago si la empresa está "PENDIENTE" -->
<!-- Alerta de pago si la empresa está "PENDIENTE" -->
<div th:if="${alertaPago}" class="alert alert-warning text-center" role="alert">
    <strong th:text="${alertaPago}"></strong>

    <form action="/payment/create" method="post" class="d-inline">
        <button type="submit" class="btn btn-sm btn-primary ms-2">
            Realizar pago
        </button>
    </form>
</div>


<!-- Contenido principal -->
<main class="d-flex justify-content-center mt-4">
    <div class="container-custom w-100 text-center">
        <h2 class="mb-3">Bienvenido a Data Register</h2>
        <p class="lead">Gestione sus trabajos, clientes y pagos de manera eficiente.</p>

        <!-- Accesos rápidos -->
        <div class="row mt-4">
            <div class="col-md-4">
                <a th:href="@{/clientes}" class="text-decoration-none">
                    <div class="card p-4">
                        <i class="bi bi-people icon-large"></i>
                        <h5 class="mt-3">Clientes</h5>
                        <p>Ver y gestionar clientes</p>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a th:href="@{/trabajos/listar}" class="text-decoration-none">
                    <div class="card p-4">
                        <i class="bi bi-clipboard-check icon-large"></i>
                        <h5 class="mt-3">Trabajos</h5>
                        <p>ver trabajos</p>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a th:href="@{/trabajos/registro}" class="text-decoration-none">
                    <div class="card p-4">
                        <i class="bi bi-plus-square icon-large"></i>
                        <h5 class="mt-3">Nuevo Trabajo</h5>
                        <p>Registrar un nuevo trabajo</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
