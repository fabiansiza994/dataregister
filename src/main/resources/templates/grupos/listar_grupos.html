<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Grupos</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="icon" href="https://dataregisterbucket.s3.us-east-2.amazonaws.com/icons/icon.png" type="image/png">
  <style>
    /* Estilos generales */
    body {
      background-color: #f8f9fa;
    }
    .container-custom {
      max-width: 800px;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Contenido principal centrado -->
<main class="d-flex justify-content-center mt-4">
  <div class="container-custom w-100">
    <h3 class="text-center mb-4">Gestión de Grupos</h3>

    <!-- Mensaje de éxito -->
    <div th:if="${param.success}" class="alert alert-success text-center">
      ¡Grupo creado con éxito!
    </div>

    <div class="mb-3 text-center">
      <a href="/grupos/nuevo" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> Crear Grupo
      </a>
    </div>

    <!-- Mostrar mensaje si no hay grupos -->
    <div th:if="${grupos.isEmpty()}" class="alert alert-warning text-center">
      <i class="bi bi-exclamation-triangle"></i> Aún no hay grupos registrados.
    </div>

    <!-- Tabla de grupos -->
    <table class="table table-bordered table-hover" th:if="${not grupos.isEmpty()}">
      <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="grupo : ${grupos}">
        <td th:text="${grupo.id}"></td>
        <td th:text="${grupo.nombre}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

</body>
</html>
