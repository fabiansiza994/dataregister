<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Nuevo Grupo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="container mt-4">
  <h2 class="text-center">Crear Nuevo Grupo</h2>

  <form th:action="@{/grupos/guardar}" method="post" th:object="${grupo}">
    <div class="mb-3">
      <label class="form-label">Nombre del Grupo</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-success">Guardar</button>
      <a href="/grupos" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>

  <hr class="my-4">

  <!-- Botón para ir a la vista de asignación de usuarios a grupos -->
  <div class="text-center">
    <a href="/grupos/asignar" class="btn btn-primary">
      <i class="bi bi-person-plus"></i> Asignar Usuarios a Grupos
    </a>
  </div>
</main>

</body>
</html>
