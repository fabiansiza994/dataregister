<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Asignar Usuarios a Grupos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="https://dataregisterbucket.s3.us-east-2.amazonaws.com/icons/icon.png" type="image/png">
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="container mt-4">
  <h2 class="text-center">Asignar Usuario a un Grupo</h2>

  <form th:action="@{/grupos/asignar-usuario}" method="post">
    <div class="mb-3">
      <label class="form-label">Seleccionar Grupo</label>
      <select class="form-control" name="grupoId" required>
        <option th:each="grupo : ${grupos}" th:value="${grupo.id}" th:text="${grupo.nombre}"></option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Seleccionar Usuario</label>
      <select class="form-control" name="usuarioId" required>
        <option th:each="usuario : ${usuarios}" th:value="${usuario.id}" th:text="${usuario.usuario}"></option>
      </select>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">Asignar Usuario</button>
      <a href="/grupos" class="btn btn-secondary">Volver</a>
    </div>
  </form>

  <hr class="my-4">

  <h3 class="text-center">Usuarios y sus Grupos</h3>

  <table class="table table-striped text-center">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Usuario</th>
      <th>Grupo</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="usuario : ${usuarios}">
      <td th:text="${usuario.id}"></td>
      <td th:text="${usuario.usuario}"></td>
      <td th:text="${usuario.grupo != null ? usuario.grupo.nombre : 'Sin Grupo'}"></td>
    </tr>
    </tbody>
  </table>

</main>

</body>
</html>
