<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <base href="https://dataregisterapp.com/" />
  <meta charset="UTF-8">
  <title>Mensajes de Soporte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body style="background-color: #f8f9fa;">

<!-- Menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="container mt-4">
  <div class="card shadow p-4">
    <h4 class="mb-4 text-center">Mensajes de Soporte Recibidos</h4>

    <!-- Formulario de Filtro -->
    <form class="row g-3 mb-4" th:action="@{/soporte/admin}" method="get">
      <div class="col-md-4">
        <label class="form-label">Filtrar por Estado:</label>
        <select class="form-select" name="estado">
          <option value="" th:selected="${estado == null or estado == ''}">Todos</option>
          <option value="PENDIENTE" th:selected="${estado == 'PENDIENTE'}">Pendiente</option>
          <option value="EN PROCESO" th:selected="${estado == 'EN PROCESO'}">En Proceso</option>
          <option value="FINALIZADO" th:selected="${estado == 'FINALIZADO'}">Finalizado</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Filtrar por Usuario:</label>
        <input type="text" class="form-control" name="usuario" th:value="${usuario}" placeholder="Nombre de usuario" />
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-filter"></i> Aplicar Filtros
        </button>
      </div>
    </form>

    <!-- Tabla de mensajes -->
    <div th:if="${mensajes != null and mensajes.isEmpty()}" class="alert alert-info text-center">
      No se han recibido mensajes con esos filtros.
    </div>

    <div class="table-responsive" th:if="${mensajes != null and !mensajes.isEmpty()}">
      <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Asunto</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="msg : ${mensajes}">
          <td th:text="${msg.id}"></td>
          <td th:text="${msg.usuario.usuario}"></td>
          <td th:text="${msg.asunto}"></td>
          <td th:text="${#temporals.format(msg.fecha, 'dd/MM/yyyy HH:mm')}"></td>
          <td>
            <span class="badge"
                  th:classappend="${msg.estado == 'PENDIENTE' ? 'bg-warning text-dark' : (msg.estado == 'EN PROCESO' ? 'bg-info text-dark' : 'bg-success')}"
                  th:text="${msg.estado}">Estado</span>
          </td>
          <td>
            <a th:href="@{/soporte/detalle/{id}(id=${msg.id})}" class="btn btn-sm btn-primary">
              <i class="bi bi-eye"></i> Ver
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<script src="/js/resolver-rutas.js"></script>
</body>
</html>
