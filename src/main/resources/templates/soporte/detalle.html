<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle de Soporte</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" href="https://dataregisterbucket.s3.us-east-2.amazonaws.com/icons/icon.png" type="image/png">
</head>
<body style="background-color: #f8f9fa;">

<!-- Menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow p-4">
        <h4 class="mb-4 text-center">Detalle del Mensaje de Soporte</h4>

        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" th:value="${soporte.usuario.usuario}" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">Asunto</label>
          <input type="text" class="form-control" th:value="${soporte.asunto}" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">Mensaje</label>
          <textarea class="form-control" rows="4" readonly th:text="${soporte.mensaje}"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Fecha de Envío</label>
          <input type="text" class="form-control" th:value="${#temporals.format(soporte.fecha, 'dd/MM/yyyy HH:mm')}" readonly>
        </div>

        <form th:action="@{/soporte/actualizar-estado}" method="post">
          <input type="hidden" name="id" th:value="${soporte.id}" />
          <div class="mb-3">
            <label class="form-label">Estado</label>
            <select class="form-select" name="estado">
              <option value="PENDIENTE" th:selected="${soporte.estado == 'PENDIENTE'}">Pendiente</option>
              <option value="EN PROCESO" th:selected="${soporte.estado == 'EN PROCESO'}">En Proceso</option>
              <option value="FINALIZADO" th:selected="${soporte.estado == 'FINALIZADO'}">Finalizado</option>
            </select>
          </div>
          <div class="d-grid">
            <button class="btn btn-primary">Actualizar Estado</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</main>

</body>
</html>
