<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar Método de Pago</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .form-container {
      max-width: 600px;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Contenido principal centrado -->
<main class="d-flex justify-content-center mt-4">
  <div class="form-container w-100">
    <h3 class="text-center mb-4">Registrar Método de Pago</h3>

    <!-- Mensaje de éxito -->
    <div th:if="${param.success}" class="alert alert-success text-center">
      ¡Método de pago registrado con éxito!
    </div>

    <form th:action="@{/metodos-pago/guardar}" method="post">
      <!-- Nombre del Método de Pago -->

      <div class="mb-3">
        <label class="form-label">Nombre del Método de Pago</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
          <input type="text" name="formaPago" class="form-control" placeholder="Ejemplo: Tarjeta de Crédito" required>
        </div>
      </div>

      <!-- Botón de Envío -->
      <button type="submit" class="btn btn-primary w-100">Guardar Método de Pago</button>
    </form>
  </div>
</main>

</body>
</html>
