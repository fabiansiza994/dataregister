<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <base href="https://dataregisterapp.com/" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Métodos de Pago</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Íconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-custom {
            max-width: 800px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Contenido principal centrado -->
<main class="d-flex justify-content-center mt-4">
    <div class="container-custom w-100">
        <h3 class="text-center mb-4">Lista de Métodos de Pago</h3>

        <!-- Mensaje de éxito -->
        <div th:if="${param.success}" class="alert alert-success text-center">
            ¡Método de pago registrado con éxito!
        </div>

        <!-- Botón para agregar un nuevo método de pago -->
        <div class="mb-3 text-center">
            <a href="/metodos-pago/nuevo" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Agregar Método de Pago
            </a>
        </div>

        <!-- Mensaje de error -->
        <div th:if="${error}" class="alert alert-danger text-center">
            <span th:text="${error}"></span>
        </div>

        <!-- Mensaje si no hay métodos de pago -->
        <div th:if="${metodosPago.isEmpty()}" class="alert alert-warning text-center">
            <i class="bi bi-exclamation-triangle"></i> Aún no hay métodos de pago registrados.
        </div>

        <!-- Tabla de métodos de pago -->
        <table class="table table-striped table-hover" th:if="${not metodosPago.isEmpty()}">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="metodo : ${metodosPago}">
                <td th:text="${metodo.id}"></td>
                <td th:text="${metodo.formaPago}"></td>
                <td>
                    <span th:class="${metodo.estado == 1 ? 'badge bg-success' : 'badge bg-danger'}"
                          th:text="${metodo.estado == 1 ? 'Activo' : 'Inactivo'}"></span>
                </td>
                <td>
                    <form th:action="@{/metodos-pago/cambiar-estado/{id}(id=${metodo.id})}" method="post">
                        <button type="submit" class="btn btn-warning btn-sm">
                            <i class="bi bi-toggle-on" th:if="${metodo.estado == 1}"></i>
                            <i class="bi bi-toggle-off" th:if="${metodo.estado == 0}"></i>
                            <span th:text="${metodo.estado == 1 ? 'Desactivar' : 'Activar'}"></span>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script src="/js/resolver-rutas.js"></script>
</body>
</html>
