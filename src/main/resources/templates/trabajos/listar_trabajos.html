<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Trabajos</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Íconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-custom {
            max-width: 900px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Contenido principal centrado -->
<main class="d-flex justify-content-center mt-4 px-2">
    <div class="container-custom w-100">
        <h3 class="text-center mb-4">Lista de Trabajos Realizados</h3>

        <!-- Mensaje de éxito al registrar -->
        <div th:if="${param.success}" class="alert alert-success text-center">
            ¡Trabajo registrado con éxito!
        </div>

        <!-- Botón de agregar trabajo -->
        <div class="mb-3 text-center">
            <a href="/trabajos/registro" class="btn btn-primary">
                <i class="bi bi-clipboard-plus"></i> Agregar Trabajo
            </a>
        </div>

        <!-- Mensaje si no hay trabajos -->
        <div th:if="${trabajos.isEmpty()}" class="alert alert-warning text-center">
            <i class="bi bi-exclamation-triangle"></i> Aún no hay trabajos registrados.
        </div>

        <!-- Tabla de trabajos responsiva -->
        <div class="table-responsive" th:if="${not trabajos.isEmpty()}">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark text-center">
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th class="d-none d-sm-table-cell">Valor Total</th>
                    <th class="d-none d-sm-table-cell">Realizado por</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="trabajo : ${trabajos}" class="text-center">
                    <td th:text="${trabajo.id}"></td>
                    <td th:text="${trabajo.fecha}"></td>
                    <td th:text="${trabajo.cliente.nombre}"></td>
                    <td class="d-none d-sm-table-cell" th:text="${trabajo.valorTotal}"></td>
                    <td class="d-none d-sm-table-cell" th:text="${trabajo.usuario.usuario}"></td>
                    <td>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <a th:href="@{/trabajos/detalle/{id}(id=${trabajo.id})}" class="btn btn-primary btn-sm">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/trabajos/editar/{id}(id=${trabajo.id})}" class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <form th:action="@{/trabajos/eliminar/{id}(id=${trabajo.id})}" method="post"
                                  onsubmit="return confirmarEliminar(this)" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<!-- SweetAlert: Confirmación antes de eliminar -->
<script>
    function confirmarEliminar(form) {
        event.preventDefault();

        Swal.fire({
            title: "¿Estás seguro?",
            text: "Esta acción no se puede deshacer.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#d33",
            cancelButtonColor: "#3085d6",
            confirmButtonText: "Sí, eliminar",
            cancelButtonText: "Cancelar"
        }).then((result) => {
            if (result.isConfirmed) {
                form.submit();
            }
        });

        return false;
    }
</script>

<!-- SweetAlert: Mostrar mensaje de éxito -->
<script th:inline="javascript" th:if="${success}">
    Swal.fire({
        icon: 'success',
        title: 'Éxito',
        text: [[${success}]],
        confirmButtonColor: '#3085d6'
    });
</script>

<!-- SweetAlert: Mostrar mensaje de error -->
<script th:inline="javascript" th:if="${error}">
    Swal.fire({
        icon: 'error',
        title: 'Error',
        text: [[${error}]],
        confirmButtonColor: '#d33'
    });
</script>

</body>
</html>
