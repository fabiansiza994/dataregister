<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Trabajos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Icons + SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-custom {
            max-width: 950px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<!-- Menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="d-flex justify-content-center mt-4 px-2">
    <div class="container-custom w-100">
        <h3 class="text-center mb-4">Lista de Trabajos Realizados</h3>

        <!-- Mensaje éxito -->
        <div th:if="${param.success}" class="alert alert-success text-center">
            ¡Trabajo registrado con éxito!
        </div>

        <!-- Botón agregar -->
        <div class="mb-3 text-center">
            <a href="/trabajos/registro" class="btn btn-primary">
                <i class="bi bi-clipboard-plus"></i> Agregar Trabajo
            </a>
        </div>

        <!-- Buscar por cliente -->
        <div class="mb-4 d-flex flex-column flex-sm-row justify-content-center gap-2">
            <input type="text" id="busquedaCliente" class="form-control" placeholder="Buscar por cliente...">
            <button onclick="cargarTrabajos(0)" class="btn btn-primary">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>

        <!-- Loader de carga -->
        <div id="loaderTrabajos" class="text-center my-4" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2 text-primary">Cargando trabajos...</p>
        </div>

        <!-- Contenedor dinámico AJAX -->
        <div id="tablaTrabajosContainer">
            <!-- Aquí se renderizan tabla o cards según pantalla -->
        </div>

        <!-- Paginación -->
        <div class="d-flex justify-content-between mt-3">
            <button id="btnAnterior" class="btn btn-outline-secondary" onclick="cargarTrabajos(paginaActual - 1)" disabled>Anterior</button>
            <button id="btnSiguiente" class="btn btn-outline-secondary" onclick="cargarTrabajos(paginaActual + 1)" disabled>Siguiente</button>
        </div>
    </div>
</main>

<script>
    let paginaActual = 0;

    function cargarTrabajos(pagina) {
        if (pagina < 0) return;

        const cliente = document.getElementById("busquedaCliente").value;
        const url = cliente
            ? `/trabajos/listarAjax?cliente=${encodeURIComponent(cliente)}&page=${pagina}`
            : `/trabajos/listarAjax?page=${pagina}`;

        document.getElementById("loaderTrabajos").style.display = "block";
        document.getElementById("tablaTrabajosContainer").style.display = "none";

        fetch(url)
            .then(res => res.json())
            .then(data => {
                const trabajos = data.content;
                let html = "";

                if (window.innerWidth < 576) {
                    // Vista móvil: cards
                    if (trabajos.length === 0) {
                        html += `<div class="alert alert-warning text-center">No se encontraron trabajos.</div>`;
                    } else {
                        trabajos.forEach(t => {
                            html += `
                        <div class="card mb-3 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Trabajo #${t.id}</h5>
                                <p class="mb-1"><strong>Fecha:</strong> ${t.fecha}</p>
                                <p class="mb-1"><strong>Cliente:</strong> ${t.cliente}</p>
                                <p class="mb-1"><strong>Valor Total:</strong> $${t.valorTotal ?? 0}</p>
                                <p class="mb-3"><strong>Realizado por:</strong> ${t.usuario}</p>
                                <div class="d-grid gap-2">
                                    <a href="/trabajos/detalle/${t.id}" class="btn btn-primary btn-sm"><i class="bi bi-eye"></i> Ver</a>
                                    <a href="/trabajos/editar/${t.id}" class="btn btn-warning btn-sm"><i class="bi bi-pencil-square"></i> Editar</a>
                                    <form action="/trabajos/eliminar/${t.id}" method="post" onsubmit="return confirmarEliminar(this)">
                                        <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i> Eliminar</button>
                                    </form>
                                </div>
                            </div>
                        </div>`;
                        });
                    }
                } else {
                    // Vista escritorio: tabla
                    html += `
                <div class="table-responsive d-none d-sm-block">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark text-center">
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th class="d-none d-md-table-cell">Valor Total</th>
                            <th class="d-none d-md-table-cell">Realizado por</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>`;

                    if (trabajos.length === 0) {
                        html += `<tr><td colspan="6" class="text-center text-warning">No se encontraron trabajos.</td></tr>`;
                    } else {
                        trabajos.forEach(t => {
                            html += `
                        <tr class="text-center">
                            <td>${t.id}</td>
                            <td>${t.fecha}</td>
                            <td>${t.cliente}</td>
                            <td class="d-none d-md-table-cell">${t.valorTotal ?? 0}</td>
                            <td class="d-none d-md-table-cell">${t.usuario}</td>
                            <td>
                                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                                    <a href="/trabajos/detalle/${t.id}" class="btn btn-primary btn-sm"><i class="bi bi-eye"></i></a>
                                    <a href="/trabajos/editar/${t.id}" class="btn btn-warning btn-sm"><i class="bi bi-pencil-square"></i></a>
                                    <form action="/trabajos/eliminar/${t.id}" method="post" onsubmit="return confirmarEliminar(this)">
                                        <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>`;
                        });
                    }

                    html += `</tbody></table></div>`;
                }

                document.getElementById("tablaTrabajosContainer").innerHTML = html;

                paginaActual = data.number;
                document.getElementById("btnAnterior").disabled = data.first;
                document.getElementById("btnSiguiente").disabled = data.last;

                document.getElementById("loaderTrabajos").style.display = "none";
                document.getElementById("tablaTrabajosContainer").style.display = "block";
            })
            .catch(err => {
                console.error("Error al cargar trabajos:", err);
                document.getElementById("tablaTrabajosContainer").innerHTML =
                    `<div class="alert alert-danger text-center">Error al cargar los trabajos.</div>`;
                document.getElementById("loaderTrabajos").style.display = "none";
                document.getElementById("tablaTrabajosContainer").style.display = "block";
            });
    }

function confirmarEliminar(form) {
        event.preventDefault();
        Swal.fire({
            title: "¿Estás seguro?",
            text: "Esta acción no se puede deshacer.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#d33",
            cancelButtonColor: "#3085d6",
            confirmButtonText: "Sí, eliminar",
            cancelButtonText: "Cancelar"
        }).then((result) => {
            if (result.isConfirmed) {
                form.submit();
            }
        });
        return false;
    }

    window.onload = () => cargarTrabajos(0);
</script>

</body>
</html>
