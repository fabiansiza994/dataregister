<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Trabajos</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Íconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* Estilos generales */
        body {
            background-color: #f8f9fa;
        }
        .container-custom {
            max-width: 900px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Contenido principal centrado -->
<main class="d-flex justify-content-center mt-4">
    <div class="container-custom w-100">
        <h3 class="text-center mb-4">Lista de Trabajos Realizados</h3>

        <!-- Mensaje de éxito -->
        <div th:if="${param.success}" class="alert alert-success text-center">
            ¡Trabajo registrado con éxito!
        </div>

        <div class="mb-3 text-center">
            <a href="/trabajos/registro" class="btn btn-primary">
                <i class="bi bi-clipboard-plus"></i> Agregar Trabajo
            </a>
        </div>

        <!-- Mostrar mensaje si no hay trabajos -->
        <div th:if="${trabajos.isEmpty()}" class="alert alert-warning text-center">
            <i class="bi bi-exclamation-triangle"></i> Aún no hay trabajos registrados.
        </div>

        <!-- Tabla de trabajos -->
        <table class="table table-striped table-hover" th:if="${not trabajos.isEmpty()}">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Valor Total</th>
                <th>Realizado por</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="trabajo : ${trabajos}">
                <td th:text="${trabajo.id}"></td>
                <td th:text="${trabajo.fecha}"></td>
                <td th:text="${trabajo.cliente.nombre}"></td>
                <td th:text="${trabajo.valorTotal}"></td>
                <td th:text="${trabajo.usuario.usuario}"></td> <!-- Nombre de usuario -->
                <td>
                    <a th:href="@{/trabajos/detalle/{id}(id=${trabajo.id})}" class="btn btn-primary btn-sm">
                        <i class="bi bi-eye"></i> Ver Detalle
                    </a>
                    <button class="btn btn-danger btn-sm" th:attr="data-id=${trabajo.id}" onclick="confirmarEliminar(this)">
                        <i class="bi bi-trash"></i> Eliminar
                    </button>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</main>
<script>
    function confirmarEliminar(button) {
        let id = button.getAttribute("data-id");

        Swal.fire({
            title: "¿Estás seguro?",
            text: "Esta acción no se puede deshacer.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#d33",
            cancelButtonColor: "#3085d6",
            confirmButtonText: "Sí, eliminar",
            cancelButtonText: "Cancelar"
        }).then((result) => {
            if (result.isConfirmed) {
                fetch(`/trabajos/eliminar/${id}`, {
                    method: "DELETE"
                }).then(response => {
                    if (response.redirected) {
                        Swal.fire({
                            title: "Eliminado",
                            text: "El trabajo ha sido eliminado correctamente.",
                            icon: "success",
                            confirmButtonColor: "#3085d6"
                        }).then(() => {
                            window.location.href = response.url;
                        });
                    } else {
                        Swal.fire({
                            title: "Error",
                            text: "No se pudo eliminar el trabajo.",
                            icon: "error",
                            confirmButtonColor: "#d33"
                        });
                    }
                }).catch(error => {
                    console.error("Error:", error);
                    Swal.fire({
                        title: "Error",
                        text: "Ocurrió un error inesperado.",
                        icon: "error",
                        confirmButtonColor: "#d33"
                    });
                });
            }
        });
    }
</script>


</body>
</html>
