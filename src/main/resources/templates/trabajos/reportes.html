<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Google Charts -->
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }
    .container-custom {
      max-width: 800px;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="d-flex justify-content-center mt-4">
  <div class="container-custom w-100">
    <h3 class="text-center mb-4">Reportes de Ventas y Ganancias</h3>

    <!-- Filtro por fechas -->
    <form method="get" th:action="@{/trabajos/reportes}" class="text-center mb-3">
      <label class="me-2">Fecha Inicial:</label>
      <input type="date" name="fechaInicio" id="fechaInicio" class="form-control d-inline-block w-auto" required
             th:value="${fechaInicio}">

      <label class="me-2 ms-3">Fecha Final:</label>
      <input type="date" name="fechaFin" id="fechaFin" class="form-control d-inline-block w-auto" required
             th:value="${fechaFin}">

      <button type="submit" class="btn btn-primary btn-sm ms-2">Aplicar</button>
    </form>

    <!-- Mostrar resultados -->
    <div class="text-center">
      <h5>Ventas Totales: $<span th:text="${totalVentas}"></span> </h5>
      <h5>Ganancias Totales: $<span th:text="${totalGanancias}"></span> </h5>
    </div>

    <!-- Gráfico -->
    <div id="graficoReportes" style="width: 100%; height: 400px;"></div>

    <!-- Botón de exportar alineado a la derecha -->
    <div class="text-end mt-4">
      <a id="exportarExcel" class="btn btn-success btn-lg">
        <i class="bi bi-file-earmark-excel"></i> Exportar a Excel
      </a>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("exportarExcel").addEventListener("click", function (event) {
          event.preventDefault();

          let fechaInicio = document.getElementById("fechaInicio").value;
          let fechaFin = document.getElementById("fechaFin").value;

          if (!fechaInicio || !fechaFin) {
            alert("Seleccione una fecha de inicio y una fecha final antes de exportar.");
            return;
          }

          window.location.href = "/trabajos/exportar-excel?fechaInicio=" + fechaInicio + "&fechaFin=" + fechaFin;
        });
      });
    </script>


    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var totalVentas = parseFloat([[${totalVentas}]] || 0);
        var totalGanancias = parseFloat([[${totalGanancias}]] || 0);

        console.log("Debug: totalVentas =", totalVentas);
        console.log("Debug: totalGanancias =", totalGanancias);

        if (isNaN(totalVentas) || totalVentas < 0) totalVentas = 0;
        if (isNaN(totalGanancias) || totalGanancias < 0) totalGanancias = 0;

        google.charts.load('current', {packages: ['corechart']});
        google.charts.setOnLoadCallback(drawChart);

        function drawChart() {
          var data = google.visualization.arrayToDataTable([
            ['Tipo', 'Monto en $'],
            ['Ventas', totalVentas],
            ['Ganancias', totalGanancias]
          ]);

          var options = {
            title: 'Reporte de Ventas y Ganancias',
            legend: {position: 'none'},
            vAxis: {minValue: 0, maxValue: Math.max(totalVentas, totalGanancias) + 10}
          };

          var chart = new google.visualization.ColumnChart(document.getElementById('graficoReportes'));
          chart.draw(data, options);
        }
      });
    </script>
  </div>
</main>

</body>
</html>
