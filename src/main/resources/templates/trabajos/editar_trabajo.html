<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Trabajo</title>

    <!-- Bootstrap + Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />

    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
        }
        .form-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 60px auto;
        }
        .card img {
            max-height: 200px;
            object-fit: contain;
        }
    </style>
</head>
<body>

<!-- Menú -->
<div th:replace="~{fragments/menu.html}"></div>

<div class="form-card">
    <h4 class="mb-4 text-center"><i class="bi bi-pencil-square me-2"></i> Editar Trabajo</h4>

    <form th:action="@{/trabajos/actualizar}" method="post" th:object="${trabajo}" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select class="form-select" th:field="*{cliente.id}" required>
                <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombre}"></option>
            </select>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Valor Labor</label>
                <input type="number" class="form-control" step="0.01" th:field="*{valorLabor}" required oninput="calcularValores()">
            </div>
            <div class="col">
                <label class="form-label">Valor Materiales</label>
                <input type="number" class="form-control" step="0.01" th:field="*{valorMateriales}" required oninput="calcularValores()">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Ganancias</label>
                <input type="number" class="form-control" step="0.01" th:field="*{ganancias}" readonly>
            </div>
            <div class="col">
                <label class="form-label">Valor Total</label>
                <input type="number" class="form-control" step="0.01" th:field="*{valorTotal}" readonly>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Forma de Pago</label>
            <select class="form-select" th:field="*{formaPago.id}" required>
                <option th:each="forma : ${formasPago}" th:value="${forma.id}" th:text="${forma.formaPago}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción de la Labor</label>
            <textarea class="form-control" th:field="*{descripcionLabor}" rows="4"></textarea>
        </div>

        <h5 class="mb-3 mt-4">Imágenes</h5>
        <div class="row">
            <div class="col-md-6 mb-3" th:each="i : ${#numbers.sequence(1, 4)}">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <div th:if="${trabajo['foto' + i]} != null">
                            <img th:src="${trabajo['foto' + i]}" class="img-fluid mb-2 rounded" alt="Foto [[${i}]]">
                            <div class="form-check mb-2">
                                <input type="checkbox" class="form-check-input" th:id="'eliminarFoto' + ${i}" th:name="'eliminarFoto' + ${i}">
                                <label class="form-check-label text-danger fw-semibold" th:for="'eliminarFoto' + ${i}">
                                    <i class="bi bi-x-circle-fill"></i> Eliminar Foto [[${i}]]
                                </label>
                            </div>
                        </div>
                        <label class="form-label">[[${trabajo['foto' + i]} != null ? 'Reemplazar' : 'Subir']] Foto [[${i}]]</label>
                        <input type="file" class="form-control" th:name="'foto' + ${i}" accept="image/*">
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle me-1"></i> Guardar Cambios
            </button>
            <a href="/trabajos/listar" class="btn btn-secondary ms-2">
                <i class="bi bi-arrow-left"></i> Cancelar
            </a>
        </div>
    </form>
</div>

<script>
    function calcularValores() {
        let valorLabor = parseFloat(document.querySelector('[name="valorLabor"]').value) || 0;
        let valorMateriales = parseFloat(document.querySelector('[name="valorMateriales"]').value) || 0;

        let valorTotal = valorLabor + valorMateriales;
        let ganancias = valorTotal - valorMateriales;

        document.querySelector('[name="valorTotal"]').value = valorTotal.toFixed(2);
        document.querySelector('[name="ganancias"]').value = ganancias.toFixed(2);
    }
</script>

</body>
</html>
