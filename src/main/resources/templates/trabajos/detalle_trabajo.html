<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del Trabajo</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" href="https://dataregisterbucket.s3.us-east-2.amazonaws.com/icons/icon.png" type="image/png">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-custom {
            max-width: 800px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .img-thumbnail {
            max-width: 100%;
            height: auto;
            max-height: 300px;
        }
        .image-wrapper {
            position: relative;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper img {
            display: none;
        }

        .spinner-border {
            position: absolute;
        }
    </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<!-- Contenido principal centrado -->
<main class="d-flex justify-content-center mt-4">
    <div class="container-custom w-100">
        <h3 class="text-center mb-4">Detalle del Trabajo</h3>

        <div class="mb-3">
            <strong>ID:</strong> <span th:text="${trabajo.id}"></span>
        </div>
        <div class="mb-3">
            <strong>Fecha:</strong> <span th:text="${trabajo.fecha}"></span>
        </div>
        <div class="mb-3">
            <strong>Cliente:</strong> <span th:text="${trabajo.cliente.nombre} + ' ' + ${trabajo.cliente.apellido}"></span>
        </div>
        <div class="mb-3">
            <strong>Valor Total:</strong> $ <span th:text="${trabajo.valorTotal}"></span>
        </div>
        <div class="mb-3">
            <strong>Descripción:</strong> <span th:text="${trabajo.descripcionLabor}"></span>
        </div>
        <div class="mb-3">
            <strong>Realizado por:</strong> <span th:text="${trabajo.usuario.usuario}"></span>
        </div>

        <h4 class="text-center">Imágenes</h4>
        <div class="row g-3">
            <div class="col-md-6" th:if="${trabajo.foto1 != null}">
                <div class="image-wrapper">
                    <div class="spinner-border text-primary" role="status"></div>
                    <img th:src="${trabajo.foto1}" class="img-thumbnail" alt="Foto 1" onload="mostrarImagen(this)">
                </div>
            </div>
            <div class="col-md-6" th:if="${trabajo.foto2 != null}">
                <div class="image-wrapper">
                    <div class="spinner-border text-primary" role="status"></div>
                    <img th:src="${trabajo.foto2}" class="img-thumbnail" alt="Foto 2" onload="mostrarImagen(this)">
                </div>
            </div>
            <div class="col-md-6" th:if="${trabajo.foto3 != null}">
                <div class="image-wrapper">
                    <div class="spinner-border text-primary" role="status"></div>
                    <img th:src="${trabajo.foto3}" class="img-thumbnail" alt="Foto 3" onload="mostrarImagen(this)">
                </div>
            </div>
            <div class="col-md-6" th:if="${trabajo.foto4 != null}">
                <div class="image-wrapper">
                    <div class="spinner-border text-primary" role="status"></div>
                    <img th:src="${trabajo.foto4}" class="img-thumbnail" alt="Foto 4" onload="mostrarImagen(this)">
                </div>
            </div>
        </div>

        <!-- Botones de acción -->
        <div class="text-center mt-4 d-flex justify-content-between">
            <a href="/trabajos/listar" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
            <a th:href="@{/trabajos/factura/{id}(id=${trabajo.id})}" class="btn btn-success" target="_blank">
                <i class="bi bi-file-earmark-pdf"></i> Descargar Detalle PDF
            </a>
        </div>
    </div>
</main>

<script>
    function mostrarImagen(img) {
        const wrapper = img.closest(".image-wrapper");
        const spinner = wrapper.querySelector(".spinner-border");
        spinner.style.display = "none";
        img.style.display = "block";
    }
</script>

</body>
</html>
