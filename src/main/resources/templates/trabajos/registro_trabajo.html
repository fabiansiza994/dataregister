<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <base href="https://dataregisterapp.com/" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Trabajo</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Íconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 600px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>

    <script>
        function calcularValores() {
            let valorLabor = parseFloat(document.getElementById("valorLabor").value) || 0;
            let valorMateriales = parseFloat(document.getElementById("valorMateriales").value) || 0;

            let valorTotal = valorLabor + valorMateriales;
            document.getElementById("valorTotal").value = valorTotal.toFixed(2);

            let ganancias = valorTotal - valorMateriales;
            document.getElementById("ganancias").value = ganancias.toFixed(2);
        }
    </script>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="d-flex justify-content-center mt-4">
    <div class="form-container w-100">
        <h3 class="text-center mb-4">Registrar Trabajo</h3>

        <form th:action="@{/trabajos/guardar}" method="post" enctype="multipart/form-data">

            <!-- Fecha -->
            <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" name="fecha" class="form-control" required>
            </div>

            <!-- Valor Labor -->
            <div class="mb-3">
                <label class="form-label">Valor Labor</label>
                <input type="number" step="0.01" name="valorLabor" id="valorLabor" class="form-control" required oninput="calcularValores()">
            </div>

            <!-- Valor Materiales -->
            <div class="mb-3">
                <label class="form-label">Valor Materiales</label>
                <input type="number" step="0.01" name="valorMateriales" id="valorMateriales" class="form-control" required oninput="calcularValores()">
            </div>

            <!-- Ganancias (Calculado) -->
            <div class="mb-3">
                <label class="form-label" hidden="true">Ganancias</label>
                <input type="number" step="0.01" name="ganancias" id="ganancias" class="form-control" readonly hidden="true">
            </div>

            <!-- Valor Total (Calculado) -->
            <div class="mb-3">
                <label class="form-label">Valor Total</label>
                <input type="number" step="0.01" name="valorTotal" id="valorTotal" class="form-control" readonly>
            </div>

            <!-- Descripción -->
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea name="descripcionLabor" class="form-control" rows="3" required></textarea>
            </div>

            <!-- Fotos del Trabajo -->
            <div class="mb-3">
                <label class="form-label">Fotos del Trabajo (Opcional)</label>
                <input type="file" name="foto1" class="form-control" accept="image/*">
                <input type="file" name="foto2" class="form-control mt-2" accept="image/*">
                <input type="file" name="foto3" class="form-control mt-2" accept="image/*">
                <input type="file" name="foto4" class="form-control mt-2" accept="image/*">
            </div>


            <!-- Cliente (Solo se selecciona desde el modal) -->
            <div class="mb-3">
                <label class="form-label">Cliente</label>
                <div class="input-group">
                    <input type="hidden" id="clienteId" name="cliente.id">
                    <input type="text" id="clienteNombre" class="form-control" placeholder="Selecciona un cliente..." readonly required>
                    <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalSeleccionCliente">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>

            <!-- Forma de Pago -->
            <div class="mb-3">
                <label class="form-label">Forma de Pago</label>
                <select name="formaPago.id" class="form-select" required>
                    <option th:each="forma : ${formasPago}" th:value="${forma.id}" th:text="${forma.formaPago}"></option>
                </select>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="btn btn-primary w-100" id="btnRegistrarTrabajo">Registrar Trabajo</button>
        </form>
    </div>
</main>

<!-- Modal de Selección de Cliente -->
<div class="modal fade" id="modalSeleccionCliente" tabindex="-1" aria-labelledby="modalSeleccionClienteLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalSeleccionClienteLabel">Seleccionar Cliente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Campo de búsqueda -->
                <input type="text" id="buscarCliente" class="form-control mb-3" placeholder="Buscar cliente..." oninput="filtrarClientes()">

                <!-- Tabla de clientes -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="listaClientes">
                        <!-- Clientes se cargarán dinámicamente -->
                        </tbody>
                    </table>
                </div>

                <!-- Botones de paginación -->
                <div class="d-flex justify-content-between">
                    <button class="btn btn-secondary" id="btnAnterior" onclick="cargarClientes(currentPage - 1)" disabled>Anterior</button>
                    <button class="btn btn-secondary" id="btnSiguiente" onclick="cargarClientes(currentPage + 1)">Siguiente</button>
                </div>

                <!-- Botón para abrir el modal de registro de cliente -->
                <div class="d-flex justify-content-center mt-3">
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalRegistroCliente">
                        <i class="bi bi-plus-lg"></i> Agregar Cliente
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Registro de Cliente -->
<div class="modal fade" id="modalRegistroCliente" tabindex="-1" aria-labelledby="modalRegistroClienteLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalRegistroClienteLabel">Registrar Cliente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formNuevoCliente">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombreCliente" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" id="apellidoCliente" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="direccionCliente" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="telefonoCliente" class="form-control">
                    </div>
                    <button type="button" class="btn btn-success w-100" onclick="registrarCliente()">
                        <i class="bi bi-check-circle"></i> Guardar Cliente
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>


<script>
    let currentPage = 0;

    function cargarClientes(page) {
        if (page < 0) return;

        fetch(`/clientes/listarAjax?page=${page}`)
            .then(response => response.json())
            .then(data => {
                actualizarTablaClientes(data.content);
                currentPage = data.number;
                document.getElementById("btnAnterior").disabled = data.first;
                document.getElementById("btnSiguiente").disabled = data.last;
            })
            .catch(error => console.error("Error al cargar clientes:", error));
    }

    function actualizarTablaClientes(clientes) {
        let listaClientes = document.getElementById("listaClientes");
        listaClientes.innerHTML = "";

        clientes.forEach(cliente => {
            let row = `
            <tr>
                <td>${cliente.nombre}</td>
                <td>${cliente.apellido}</td>
                <td>
                    <button type="button" class="btn btn-success btn-sm" onclick="seleccionarCliente('${cliente.id}', '${cliente.nombre}', '${cliente.apellido}')">
                        <i class="bi bi-check-circle"></i> Seleccionar
                    </button>
                </td>
            </tr>
            `;
            listaClientes.innerHTML += row;
        });
    }

    document.getElementById("modalSeleccionCliente").addEventListener("show.bs.modal", function () {
        cargarClientes(0);
    });

    function seleccionarCliente(id, nombre, apellido) {
        document.getElementById("clienteId").value = id;
        document.getElementById("clienteNombre").value = nombre + " " + apellido;

        let modal = bootstrap.Modal.getInstance(document.getElementById("modalSeleccionCliente"));
        modal.hide();
    }

    function filtrarClientes() {
        let filtro = document.getElementById("buscarCliente").value.toLowerCase();
        let filas = document.querySelectorAll("#listaClientes tr");
        let encontrado = false;

        if (filtro === "") {
            // Si el campo está vacío, recargar la lista original de clientes
            cargarClientes(currentPage);
            return;
        }

        filas.forEach(fila => {
            let nombre = fila.cells[0].textContent.toLowerCase();
            let apellido = fila.cells[1].textContent.toLowerCase();
            let coincide = nombre.includes(filtro) || apellido.includes(filtro);

            fila.style.display = coincide ? "" : "none";

            if (coincide) encontrado = true;
        });

        // Si no hay coincidencias en la tabla, buscar en la base de datos
        if (!encontrado && filtro.length > 2) {
            fetch(`/clientes/buscarAjax?nombre=${filtro}`)
                .then(response => response.json())
                .then(data => actualizarTablaClientes(data))
                .catch(error => console.error("Error al buscar clientes:", error));
        }
    }

    const form = document.querySelector("form");
    const btn = document.getElementById("btnRegistrarTrabajo");

    form.addEventListener("submit", function (event) {
        // Verifica si el formulario es válido
        if (form.checkValidity()) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Registrando...';
        } else {
            // Deja que el navegador muestre los errores
            event.preventDefault();
            form.classList.add('was-validated'); // útil si quieres usar estilos Bootstrap
        }
    });

    function registrarCliente() {
        const nombre = document.getElementById("nombreCliente").value;
        const apellido = document.getElementById("apellidoCliente").value;
        const direccion = document.getElementById("direccionCliente").value;
        const telefono = document.getElementById("telefonoCliente").value;

        fetch('/clientes/guardarAjax', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                nombre,
                apellido,
                direccion,
                telefono
            })
        })
            .then(response => response.json())
            .then(cliente => {
                // Auto-seleccionar cliente recién creado
                seleccionarCliente(cliente.id, cliente.nombre, cliente.apellido);

                // Cerrar modal
                const modal = bootstrap.Modal.getInstance(document.getElementById("modalRegistroCliente"));
                modal.hide();

                // Limpiar formulario
                document.getElementById("formNuevoCliente").reset();

                // Volver a cargar clientes en el modal
                cargarClientes(0);
            })
            .catch(error => {
                console.error("Error al registrar cliente:", error);
                Swal.fire("Error", "No se pudo registrar el cliente", "error");
            });
    }

</script>

</body>
</html>
