<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <base href="https://dataregisterapp.com/" />
  <meta charset="UTF-8">
  <title>Lista de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Bootstrap JS (necesario para dropdowns, modals, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body { background-color: #f8f9fa; }
    .container-custom {
      max-width: 800px;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

<!-- Menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="d-flex justify-content-center mt-4 px-2">
  <div class="container-custom w-100">
    <h3 class="text-center mb-4">Lista de Usuarios</h3>

    <!-- Buscar por nombre -->
    <form th:action="@{/usuarios/buscar}" method="get"
          class="mb-3 d-flex flex-column flex-sm-row justify-content-center gap-2">
      <input type="text" name="nombre" th:value="${nombreBuscado}" class="form-control"
             placeholder="Buscar por nombre o usuario">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-search"></i> Buscar
      </button>
    </form>

    <!-- No encontrados -->
    <div th:if="${usuarios.isEmpty() and nombreBuscado != null}" class="alert alert-warning text-center">
      <i class="bi bi-exclamation-triangle"></i> No se encontraron usuarios con el nombre
      "<span th:text="${nombreBuscado}"></span>".
    </div>

    <!-- Tabla -->
    <div class="table-responsive" th:if="${not usuarios.isEmpty()}">
      <table class="table table-bordered table-hover text-center">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
          <td th:text="${usuario.id}"></td>
          <td th:text="${usuario.usuario}"></td>
          <td th:text="${usuario.nombre + ' ' + usuario.apellido}"></td>
          <td th:text="${usuario.email}"></td>
          <td th:text="${usuario.rol.nombre}"></td>
          <td>
                            <span th:class="${usuario.bloqueado} ? 'badge bg-danger' : 'badge bg-success'"
                                  th:text="${usuario.bloqueado} ? 'BLOQUEADO' : 'ACTIVO'"></span>
          </td>
          <td>
            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
              <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-secondary btn-sm">
                <i class="bi bi-pencil-square"></i>
              </a>
              <a th:href="@{/usuarios/resetear-password/{id}(id=${usuario.id})}" class="btn btn-warning btn-sm">
                <i class="bi bi-key-fill"></i>
              </a>
              <!--<form th:action="@{/usuarios/eliminar/{id}(id=${usuario.id})}" method="post"
                    onsubmit="return confirmarEliminarUsuario(this)">
                <button type="submit" class="btn btn-danger btn-sm">
                  <i class="bi bi-trash"></i>
                </button>
              </form>-->
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
  function confirmarEliminarUsuario(form) {
    event.preventDefault();
    Swal.fire({
      title: "¿Eliminar usuario?",
      text: "Esta acción no se puede deshacer.",
      icon: "warning",
      showCancelButton: true,
      confirmButtonColor: "#d33",
      cancelButtonColor: "#3085d6",
      confirmButtonText: "Sí, eliminar",
      cancelButtonText: "Cancelar"
    }).then((result) => {
      if (result.isConfirmed) {
        form.submit();
      }
    });
    return false;
  }
</script>
<script src="/js/resolver-rutas.js"></script>
</body>
</html>
