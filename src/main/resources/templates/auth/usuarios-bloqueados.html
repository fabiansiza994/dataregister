<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios Bloqueados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/menu.html}"></div>
<div class="container mt-5">
    <h2 class="mb-4">Usuarios Bloqueados</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Intentos</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(usuariosBloqueados)}">
            <td colspan="6" class="text-center text-muted">No hay usuarios bloqueados en esta empresa.</td>
        </tr>
        <tr th:each="usuario : ${usuariosBloqueados}">
            <td th:text="${usuario.id}"></td>
            <td th:text="${usuario.usuario}"></td>
            <td th:text="${usuario.nombre + ' ' + usuario.apellido}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.intentosFallidos}"></td>
            <td>
                <form th:action="@{/auth/desbloquear/{id}(id=${usuario.id})}" method="post">
                    <button type="submit" class="btn btn-success btn-sm">Desbloquear</button>
                </form>
            </td>
        </tr>
        </tbody>

    </table>
</div>

</body>
</html>
