<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh">

<div class="card shadow p-4" style="width: 100%; max-width: 500px;">
    <h3 class="mb-4 text-center">Registro de Usuario</h3>

    <!-- Mensaje de error -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/registro}" method="post" th:object="${usuario}">
        <input type="hidden" th:field="*{id}" value="0" />

        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" th:field="*{usuario}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Apellido</label>
            <input type="text" th:field="*{apellido}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" th:field="*{email}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" th:field="*{password}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Rol</label>
            <select th:field="*{rol.id}" class="form-select" required>
                <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombre}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Registrar</button>
    </form>
</div>

</body>
</html>
