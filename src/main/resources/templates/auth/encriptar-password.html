<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Codificar contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="icon" href="https://dataregisterbucket.s3.us-east-2.amazonaws.com/icons/icon.png" type="image/png">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

<div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
  <h4 class="mb-3">Codificador de contraseñas (BCrypt)</h4>

  <form th:action="@{/encriptar}" method="post">
    <div class="mb-3">
      <label class="form-label">Contraseña en texto plano</label>
      <input type="text" name="password" class="form-control" required/>
    </div>
    <button type="submit" class="btn btn-primary w-100">Codificar</button>
  </form>

  <div class="mt-4" th:if="${encodedPassword}">
    <label class="form-label">Contraseña cifrada:</label>
    <textarea class="form-control" readonly rows="3" th:text="${encodedPassword}"></textarea>
  </div>
</div>

</body>
</html>
