<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <base href="https://dataregisterapp.com/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resetear Contraseña</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container-custom {
            max-width: 600px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="d-flex justify-content-center mt-4 px-2">
    <div class="container-custom w-100">
        <h3 class="text-center mb-4">Resetear Contraseña</h3>

        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success text-center" th:text="${success}"></div>

        <form th:action="@{/usuarios/resetear-password}" method="post">
            <input type="hidden" name="id" th:value="${usuario.id}" />

            <div class="mb-3">
                <label class="form-label">Nuevo Password</label>
                <input type="password" name="nuevaPassword" class="form-control" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar Password</label>
                <input type="password" name="confirmarPassword" class="form-control" required />
            </div>

            <button type="submit" class="btn btn-primary w-100">Actualizar Contraseña</button>
        </form>
    </div>
</main>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Mostrar mensajes -->
<script th:inline="javascript">
    if ([[${success} != null]]) {
        Swal.fire({
            icon: 'success',
            title: 'Contraseña actualizada',
            text: [[${success}]],
            confirmButtonColor: '#0d6efd'
        }).then(() => {
            window.location.href = '/usuarios'; // redirigir después del éxito
        });
    }

    if ([[${error} != null]]) {
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: [[${error}]],
            confirmButtonColor: '#d33'
        });
    }
</script>
<script src="/js/resolver-rutas.js"></script>
</body>
</html>
