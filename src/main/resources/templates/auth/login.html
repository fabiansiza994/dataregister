<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />

    <style>
        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
        }

        .login-box {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            animation: fadeIn 0.6s ease-in-out;
            width: 100%;
            max-width: 900px;
        }

        .login-left {
            background: #0d6efd;
            color: white;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-left h2 {
            font-weight: bold;
        }

        .login-right {
            padding: 2.5rem 2rem;
        }

        .login-icon {
            font-size: 3rem;
            color: #0d6efd;
            margin-bottom: 1rem;
        }

        .form-control {
            height: 45px;
            font-size: 1rem;
        }

        .btn-primary {
            height: 45px;
            font-size: 1rem;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .login-left {
                display: none;
            }
            .login-right {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="container px-3">
    <div class="row login-box mx-auto">

        <!-- Columna izquierda: branding / mensaje -->
        <div class="col-md-6 login-left text-center">
            <h2>¡Bienvenido!</h2>
            <p class="mt-3">Gestiona tus trabajos y clientes desde un solo lugar.</p>
            <i class="bi bi-bar-chart-fill mt-4" style="font-size: 4rem;"></i>
        </div>

        <!-- Columna derecha: formulario -->
        <div class="col-md-6 login-right text-center">
            <div class="login-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4 class="mb-3">Inicia sesión en <span class="text-primary">Data Register</span></h4>
            <p class="text-muted mb-4">Ingresa tus credenciales para continuar</p>

            <!-- Mensaje de error -->
            <div th:if="${error}" class="alert alert-danger text-center">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}"></span>
            </div>

            <form action="/login" method="post" class="text-start">
                <!-- Usuario -->
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="usuario" class="form-control" placeholder="Ingrese su usuario" required>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
                    </div>
                </div>

                <!-- Botón -->
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
