<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Usuario</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="icon" href="https://dataregisterbucket.s3.us-east-2.amazonaws.com/icons/icon.png" type="image/png">
  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />

  <style>
    body {
      background-color: #f8f9fa;
    }
    .container-custom {
      max-width: 600px;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

<!-- Incluir menú -->
<div th:replace="~{fragments/menu.html}"></div>

<main class="d-flex justify-content-center mt-4 px-2">
  <div class="container-custom w-100">
    <h3 class="text-center mb-4">Editar Usuario</h3>

    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

    <form th:action="@{/usuarios/actualizar}" method="post" th:object="${usuario}">
      <input type="hidden" th:field="*{id}" />

      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" th:field="*{usuario}" class="form-control" readonly />
      </div>

      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" th:field="*{nombre}" class="form-control" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Apellido</label>
        <input type="text" th:field="*{apellido}" class="form-control" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" th:field="*{email}" class="form-control" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Grupo</label>
        <select th:field="*{grupo.id}" class="form-select" required>
          <option th:each="grupo : ${grupos}" th:value="${grupo.id}" th:text="${grupo.nombre}"></option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Rol</label>
        <select th:field="*{rol.id}" class="form-select" required>
          <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombre}"></option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100">Actualizar</button>
    </form>
  </div>
</main>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Mostrar mensajes -->
<script th:inline="javascript">
  /* Éxito */
  /* success viene del RedirectAttributes */
  if ([[${success} != null]]) {
    Swal.fire({
      icon: 'success',
      title: '¡Actualizado!',
      text: [[${success}]],
      confirmButtonColor: '#0d6efd'
    });
  }

  /* Error */
  if ([[${error} != null]]) {
    Swal.fire({
      icon: 'error',
      title: 'Error',
      text: [[${error}]],
      confirmButtonColor: '#d33'
    });
  }
</script>

</body>
</html>
