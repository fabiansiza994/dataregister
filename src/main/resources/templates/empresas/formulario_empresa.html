<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <base href="https://dataregisterapp.com/" />
  <meta charset="UTF-8">
  <title>Registrar Empresa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/menu.html}"></div>

<main class="container mt-4">
  <h2 class="text-center">Registrar Empresa</h2>

  <form th:action="@{/empresas/guardar}" method="post" th:object="${empresa}">
    <div class="mb-3">
      <label class="form-label">Nombre de la Empresa</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">NIT</label>
      <input type="text" class="form-control" th:field="*{nit}" required>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-success">Guardar Empresa</button>
      <a href="/" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</main>
<script src="/js/resolver-rutas.js"></script>
</body>
</html>
